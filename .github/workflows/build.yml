name: build
on:
  schedule:
    - cron: '0 0 * * 1,4'
  workflow_dispatch:  # allows the workflow to be triggered manually
    inputs:
      versions:
        description: '指定要构建的版本，逗号分隔。可写 X.Y（自动取该 minor 的最新 patch）或 X.Y.Z。留空 = 自动扫描各 minor 的最新 patch'
        required: false
        default: ''
      force:
        description: '忽略 GHCR 已有 tag，强制重建并重推标签（修复 latest / ee 等移动标签时用）'
        type: boolean
        default: false

jobs:
  setup-versions:
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.get-versions.outputs.versions }}
      latest_version: ${{ steps.get-versions.outputs.latest_version }}
    steps:
      - uses: actions/checkout@v3

      # 版本来源见 .github/scripts/get_versions.py 顶部注释：
      # atom feed 只有 ~14 个 tag（2~3 个 minor），漏掉过 18.8（升级路径必须停留的版本），
      # 改用 tags API（一页 100 个 tag ≈ 12 个 minor ≈ 一年）。
      - name: Resolve GitLab versions to build
        id: get-versions
        env:
          INPUT_VERSIONS: ${{ github.event.inputs.versions }}
        run: python3 .github/scripts/get_versions.py

  build:
    runs-on: ubuntu-latest
    needs: setup-versions
    strategy:
      fail-fast: false
      matrix:
        PACKAGE_CAT: [ce, ee]
        PACKAGE_VERSIONS: ${{fromJson(needs.setup-versions.outputs.versions)}}
        include:
          - LATEST_VERSION: ${{needs.setup-versions.outputs.latest_version}}

    steps:
      - uses: actions/checkout@v3

      - name: Get latest GitLab version
        id: get-version
        run: |
          PACKAGE_CAT=${{ matrix.PACKAGE_CAT }}
          VERSION=${{ matrix.PACKAGE_VERSIONS }}
          RELEASE_VERSION="$VERSION-$PACKAGE_CAT.0"
          echo "RELEASE_VERSION=$RELEASE_VERSION" >> $GITHUB_ENV

          # force=true 时跳过存在性检查，强制重建并重推标签
          # （用于把 latest / ee / <major>-ee 这类移动标签修复回正确的版本）
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            echo "force=true：跳过 GHCR 检查，强制重建并重推标签"
            echo "TAG_EXISTS=false" >> $GITHUB_ENV
            exit 0
          fi

          # Check if the tag exists in GHCR.
          # 注意：这里必须用 GHCR 的匿名 pull token 查 manifest。原来那套
          # `Authorization: Bearer $(base64 GITHUB_TOKEN)` 是无效凭据，实测无论 tag
          # 存不存在都返回 MANIFEST_UNKNOWN，等于永远判定"不存在"、每次 run 全量重建。
          TOKEN=$(curl -sS "https://ghcr.io/token?scope=repository:${{ github.repository_owner }}/gitlab-arm64:pull&service=ghcr.io" \
            | python3 -c 'import sys, json; print(json.load(sys.stdin)["token"])')
          CODE=$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer ${TOKEN}" \
            -H 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.docker.distribution.manifest.v2+json' \
            "https://ghcr.io/v2/${{ github.repository_owner }}/gitlab-arm64/manifests/${RELEASE_VERSION}")

          if [ "$CODE" = "200" ]; then
            echo "Tag $RELEASE_VERSION exists in GHCR. Skip the build."
            echo "TAG_EXISTS=true" >> $GITHUB_ENV
          else
            echo "Tag $RELEASE_VERSION does not exist in GHCR (HTTP $CODE). Continue the workflow."
            echo "TAG_EXISTS=false" >> $GITHUB_ENV
          fi


      - name: Generate PUSH_TAGS
        id: generate-push-tags
        if: env.TAG_EXISTS == 'false'
        run: |
          VERSION=${{ env.RELEASE_VERSION }}
          PACKAGE_CAT=${{ matrix.PACKAGE_CAT }}
          VERSION=${VERSION/-$PACKAGE_CAT.0/}
          IFS='.' read -ra VER <<< "$VERSION"
          PUSH_TAGS="${VERSION}-$PACKAGE_CAT.0, ${VERSION}-$PACKAGE_CAT, ${VER[0]}.${VER[1]}-$PACKAGE_CAT"
          if [[ "${{ matrix.LATEST_VERSION }}" == "${VERSION}" ]]; then
            PUSH_TAGS="${PUSH_TAGS}, ${VER[0]}-$PACKAGE_CAT, $PACKAGE_CAT"
            if [[ "$PACKAGE_CAT" == "ee" ]]; then
              PUSH_TAGS="${PUSH_TAGS}, latest-${VER[0]}, latest"
            fi
          fi
          echo "PUSH_TAGS=$PUSH_TAGS" >> $GITHUB_ENV

      - name: docker login to docker.io
        if: env.TAG_EXISTS == 'false'
        uses: docker/login-action@v2
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Must set write access in the package settings
      # See: https://github.com/docker/build-push-action/issues/463#issuecomment-924995909
      - name: docker login to ghcr.io
        if: env.TAG_EXISTS == 'false'
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup binfmt-support
        if: env.TAG_EXISTS == 'false'
        uses: docker/setup-qemu-action@v2

      - name: Setup docker buildx
        if: env.TAG_EXISTS == 'false'
        uses: docker/setup-buildx-action@v2

      - name: Generate tags
        id: generate-tags
        if: env.TAG_EXISTS == 'false'
        run: |
          dockerio_tags=$(echo ${{ env.PUSH_TAGS }} | tr ',' '\n' | xargs -I {} echo "docker.io/${{ secrets.DOCKERHUB_USERNAME }}/gitlab-arm64:{}" | tr '\n' ',')
          ghcr_tags=$(echo ${{ env.PUSH_TAGS }} | tr ',' '\n' | xargs -I {} echo "ghcr.io/${{ github.repository_owner }}/gitlab-arm64:{}" | tr '\n' ',')
          echo "push_tags=${dockerio_tags},${ghcr_tags}" >> $GITHUB_ENV

      - name: Build and push
        if: env.TAG_EXISTS == 'false'
        uses: docker/build-push-action@v3
        with:
          context: .
          push: true
          tags: ${{ env.push_tags }}
          platforms: linux/arm64
          build-args: |
            RELEASE_PACKAGE=gitlab-${{ matrix.PACKAGE_CAT }}
            RELEASE_VERSION=${{ env.RELEASE_VERSION }}
